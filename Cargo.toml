[package]
name = "tree-sitter-oklang"
description = "OKLang grammer for tree-sitter"
version = "0.1.0"
authors = ["qais <qaisalsaid4@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "oklang"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/qais/tree-sitter-oklang"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
